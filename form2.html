<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご連絡先の確認</title>
<!--
  てとて 相談引き継ぎフォーム（LIFF）
 
  【この版で変わったこと ＝ C案】
  これまでは liff.sendMessages() でフォームの中身を「相談者本人の発言」として
  トークに流していた。そのため電話番号や氏名がトーク画面に残り、
  同居者に見られる可能性があった。
 
  この版では、中身は fetch で中継サーバー（Cloudflare Worker）へ直接送る。
  トークに出るのは「受付しました」という短い合図だけ。
 
  【モード】 ?mode= で切り替える。タイトルは全モード共通（どちらのフォームか
  相手に分からせない）。
    ask     … 冒頭1問だけ聞いて general / safety に振り分ける（AIが迷ったとき）
    general … 折り返しのご予約（こちらからお電話する）
    safety  … 安全に配慮したご予約（相談者からLINE通話でかけてもらう）
    rebook  … 再予約（無機質。日時と状況だけ）
    note    … 備考・特記事項（予約後の連絡、状況の変化）
    close   … 終了確認（相談員が手動で送る）
-->
<style>
  :root{
    --bg:#f7f7f5; --card:#fff; --ink:#23282b; --sub:#5f6b70;
    --line:#dfe3e2; --accent:#3c7a68; --accent-ink:#fff;
    --warn:#8a4b2a; --warn-bg:#fdf3ec; --req:#b4472e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 64px}
  h1{font-size:19px;margin:4px 0 6px;letter-spacing:.02em}
  .lead{color:var(--sub);font-size:14px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 16px;margin-bottom:14px}
  .q{font-weight:600;font-size:15px;margin:0 0 4px}
  .hint{color:var(--sub);font-size:13px;margin:0 0 10px}
  .req{color:var(--req);font-size:12px;margin-left:4px;font-weight:600}
  label.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin-bottom:8px;
    border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
  label.opt:last-child{margin-bottom:0}
  label.opt input{margin:5px 0 0;flex:none;width:19px;height:19px;accent-color:var(--accent)}
  label.opt span{flex:1}
  input[type=text],input[type=tel],input[type=date],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font-size:16px;font-family:inherit;color:var(--ink)}
  textarea{min-height:110px;resize:vertical;line-height:1.7}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .notice{background:var(--warn-bg);border-left:3px solid var(--warn);
    border-radius:0 8px 8px 0;padding:12px 14px;font-size:13.5px;color:#4a3428;margin-bottom:14px}
  .notice b{color:var(--warn)}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;
    background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;margin-top:6px}
  .btn:disabled{opacity:.5}
  .btn.sub{background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-top:10px}
  .err{color:var(--req);font-size:13px;margin-top:6px;display:none}
  .err.on{display:block}
  #status{text-align:center;padding:28px 8px;color:var(--sub);font-size:14.5px}
  .done{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 18px}
  .done h2{font-size:17px;margin:0 0 12px}
  .done p{font-size:14.5px;margin:0 0 12px;line-height:1.85}
  .done .tip{background:#f0f4f2;border-radius:9px;padding:13px 14px;font-size:13.5px;color:#3d4a45}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="app" class="hidden"></div>
  <div id="status">読み込んでいます…</div>
</div>
 
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============================================================
   設定
   ============================================================ */
var LIFF_ID  = '2010836980-ms5nFPQE';
var ENDPOINT = 'https://tetote-line-dify.eshanten18111.workers.dev/form';
 
/* 受付時間 9:00〜22:00 に合わせた選択肢 */
var TIME_BANDS = [
  '9時〜12時', '12時〜15時', '15時〜18時', '18時〜20時', '20時〜22時'
];
/*
   お約束は「時刻」ではなく「1時間の枠」で取る。
   担当者はその1時間のあいだ待機する。相談者の側も、分単位で合わせる負担がなくなる。
   value は開始時刻（GAS側で +1時間して締切を出すため）、表示は枠で見せる。
*/
var CLOCK = (function(){
  var a = [];
  for (var h = 9; h <= 21; h++) {
    a.push({ v: ('0'+h).slice(-2) + ':00', label: h + '時〜' + (h+1) + '時' });
  }
  return a;
})();
 
var PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
 
var idToken = null;
var mode = 'ask';
 
/* ============================================================
   起動
   ============================================================ */
function boot() {
  var p = new URLSearchParams(location.search);
  mode = p.get('mode') || 'ask';
  // 旧版のリンク（?mode=addendum）が残っているあいだの受け皿。
  // Difyを入れ替えるまで、古い案内文からこのリンクが送られてくるため。
  if (mode === 'addendum') mode = 'note';
 
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    if (!idToken) {
      // openid スコープが無いとここに来る。黙って壊れないように出す。
      show('<div class="card"><p class="q">開き直してください</p>'
        + '<p class="hint">お手数ですが、トーク画面に戻ってからもう一度リンクを開いてください。'
        + 'それでも表示されない場合は、その旨をトークにお送りください。</p></div>');
      return;
    }
    render();
  }).catch(function (e) {
    show('<div class="card"><p class="q">開けませんでした</p>'
      + '<p class="hint">通信の状態をご確認のうえ、もう一度お試しください。'
      + 'うまくいかないときは、その旨をトークにお送りいただければ大丈夫です。</p></div>');
    console.log(e);
  });
}
 
function show(html) {
  document.getElementById('status').classList.add('hidden');
  var app = document.getElementById('app');
  app.innerHTML = html;
  app.classList.remove('hidden');
  window.scrollTo(0, 0);
}
 
/* ============================================================
   画面の組み立て
   ============================================================ */
function render() {
  if (mode === 'ask')     return show(viewAsk());
  if (mode === 'safety')  return show(viewSafety());
  if (mode === 'rebook')  return show(viewRebook());
  if (mode === 'note')    return show(viewNote());
  if (mode === 'close')   return show(viewClose());
  return show(viewGeneral());
}
 
/* ---------- 冒頭1問（振り分け） ---------- */
/*
   AIが会話から判断しきれなかったときに開く画面。
   ここで「はい」を選んだ方には、こちらから電話をかけない設計に切り替える。
   聞くのは1問だけにする。答えづらい質問を重ねないため。
*/
function viewAsk() {
  return ''
  + '<h1>ご連絡先の確認</h1>'
  + '<p class="lead">お話をうかがうために、いくつか確認させてください。まず1つだけお聞きします。</p>'
  + '<div class="card">'
  +   '<p class="q">あなたに危害を及ぼす可能性のある人が、電話やLINEの通知を見る可能性はありますか<span class="req">必須</span></p>'
  +   '<p class="hint">同居している方、頻繁に会う方などが、着信履歴や通知画面を見られる状況かどうかをお聞きしています。判断がつかない場合は「わからない」をお選びください。</p>'
  +   '<label class="opt"><input type="radio" name="risk" value="no"><span>いいえ、見られる心配はありません</span></label>'
  +   '<label class="opt"><input type="radio" name="risk" value="yes"><span>はい、見られる可能性があります</span></label>'
  +   '<label class="opt"><input type="radio" name="risk" value="unknown"><span>わからない</span></label>'
  +   '<p class="err" id="e-risk">お選びください。</p>'
  + '</div>'
  + '<button class="btn" onclick="goNext()">次へ</button>';
}
 
function goNext() {
  var v = radio('risk');
  if (!v) { return err('e-risk', true); }
  err('e-risk', false);
  mode = (v === 'no') ? 'general' : 'safety';
  render();
}
 
/* ---------- 一般：折り返しのご予約 ---------- */
function viewGeneral() {
  return ''
  + '<h1>ご連絡先の確認</h1>'
  + '<p class="lead">担当者からお電話を差し上げます。下記をご記入ください。</p>'
  + '<div class="notice">'
  +   '<b>お電話について</b><br>'
  +   '担当者から<b>なるべく早くお電話いたします。遅くとも1週間から10日以内</b>にはご連絡します。'
  +   '日時のご指定は目安として使わせていただきます。<br>'
  +   'お出になれなかった場合は、<b>おつながりするまで日を改めておかけ直しします</b>。'
  +   '知らない番号からの着信になりますので、あらかじめご了承ください。'
  + '</div>'
  + fieldName()
  + fieldArea()
  + fieldPhoneGeneral()
  + fieldBands()
  + fieldUrgent()
  + fieldNote()
  + fieldConsent()
  + '<button class="btn" id="submit" onclick="submitForm(\'general\')">この内容で送る</button>'
  + '<p class="err" id="e-all">未記入の項目があります。上にお戻りください。</p>';
}
 
/* ---------- 安全配慮：LINE通話のご予約 ---------- */
function viewSafety() {
  return ''
  + '<h1>ご連絡先の確認</h1>'
  + '<p class="lead">お話をうかがう時間を決めさせてください。下記をご記入ください。</p>'
  + '<div class="notice">'
  +   '<b>お電話のかけ方について</b><br>'
  +   '通知や着信履歴が他の方の目に触れる恐れがある場合、こちらから電話をおかけすることで、'
  +   'かえって危険が生じることがあります。そのため<b>お客さまのほうから、LINEの無料通話でおかけいただく</b>形にしています。<br>'
  +   'LINEのトーク画面から通話ボタンを押してください。通話料はかかりません。<br>'
  +   'お時間は<b>1時間の幅</b>でお決めいただきます。その1時間のあいだ担当者がお待ちしますので、'
  +   'いつおかけいただいても構いません。<br>'
  +   'ご都合が悪くなった場合は、<b>あらためて日時を決め直していただけます</b>。'
  +   'その1時間のあいだにお話しできなかったときは、こちらから日時の入力フォームをお送りします。'
  + '</div>'
  + fieldName()
  + fieldArea()
  + fieldPhoneSafety()
  + fieldAppointment('お話しできる日時', 'ご都合のよい日と時間帯を1つお選びください。受付は9時〜22時です。')
  + fieldSituation()
  + fieldUrgent()
  + fieldNote()
  + fieldConsent()
  + '<button class="btn" id="submit" onclick="submitForm(\'safety\')">この内容で送る</button>'
  + '<p class="err" id="e-all">未記入の項目があります。上にお戻りください。</p>';
}
 
/* ---------- 再予約（無機質） ---------- */
/*
   お約束の時間に通話がなかった方へ送る。
   ここで責める言い方をしない。理由も問い詰めない。
   短く、事務的に、もう一度だけ枠を差し出す。
*/
function viewRebook() {
  return ''
  + '<h1>ご連絡先の確認</h1>'
  + '<div class="notice">'
  +   'お約束のお時間にお話しできませんでした。ご都合が合わなかったのだと思います。<br>'
  +   'あらためて日時をお決めいただけますでしょうか。1時間の幅でお選びいただき、'
  +   'そのあいだ担当者がお待ちします。'
  + '</div>'
  + fieldAppointment('あらためてのご希望日時', '日と時間帯を1つお選びください。受付は9時〜22時です。')
  + '<div class="card">'
  +   '<p class="q">ご事情がありましたらお書きください</p>'
  +   '<p class="hint">差し支えない範囲で構いません。空欄のままでも送れます。</p>'
  +   '<textarea id="situation" placeholder="例）その時間は家に人がいて話せませんでした"></textarea>'
  + '</div>'
  + '<button class="btn" id="submit" onclick="submitForm(\'rebook\')">この内容で送る</button>'
  + '<p class="err" id="e-all">日時をお選びください。</p>';
}
 
/* ---------- 備考・特記事項 ---------- */
function viewNote() {
  return ''
  + '<h1>ご連絡先の確認</h1>'
  + '<p class="lead">お伝えいただいた内容は、担当者が確認いたします。</p>'
  + '<div class="card">'
  +   '<p class="q">お伝えになりたいことをお書きください<span class="req">必須</span></p>'
  +   '<p class="hint">状況が変わった、お伝えし忘れたことがある、聞いておきたいことがある — どれでも構いません。'
  +   '短くても大丈夫です。</p>'
  +   '<textarea id="note" placeholder="例）前にお話ししたときより、体調が悪くなっています"></textarea>'
  +   '<p class="err" id="e-note">ご記入ください。</p>'
  + '</div>'
  + '<button class="btn" id="submit" onclick="submitForm(\'note\')">この内容で送る</button>';
}
 
/* ---------- 終了確認（相談員が手動で送る） ---------- */
function viewClose() {
  return ''
  + '<h1>ご連絡先の確認</h1>'
  + '<div class="notice">'
  +   'これまでのご相談を、いったん終了とさせていただいてよろしいでしょうか。<br>'
  +   '終了したあとでも、またいつでもこのトークからご連絡いただけます。'
  + '</div>'
  + '<div class="card">'
  +   '<p class="q">ご相談を終了しますか<span class="req">必須</span></p>'
  +   '<label class="opt"><input type="radio" name="close" value="はい、終了します"><span>はい、終了します</span></label>'
  +   '<label class="opt"><input type="radio" name="close" value="いいえ、続けたいです"><span>いいえ、もう少し続けたいです</span></label>'
  +   '<p class="err" id="e-close">お選びください。</p>'
  + '</div>'
  + '<div class="card">'
  +   '<p class="q">お伝えになりたいことがあればお書きください</p>'
  +   '<p class="hint">空欄のままでも送れます。</p>'
  +   '<textarea id="note" placeholder=""></textarea>'
  + '</div>'
  + '<button class="btn" id="submit" onclick="submitForm(\'close\')">この内容で送る</button>';
}
 
/* ============================================================
   部品
   ============================================================ */
function fieldName() {
  return '<div class="card">'
  + '<p class="q">お呼びする名前<span class="req">必須</span></p>'
  + '<p class="hint">本名でなくて構いません。お電話のときにお呼びする呼び名をお書きください。</p>'
  + '<input type="text" id="name" placeholder="例）たなか、みかん">'
  + '<p class="err" id="e-name">ご記入ください。</p>'
  + '</div>';
}
 
function fieldArea() {
  var opts = '<option value="">選んでください</option>';
  for (var i = 0; i < PREFS.length; i++) opts += '<option>' + PREFS[i] + '</option>';
  return '<div class="card">'
  + '<p class="q">お住まいの地域<span class="req">必須</span></p>'
  + '<p class="hint">お近くで使える制度や窓口をお探しするために使います。番地までは必要ありません。</p>'
  + '<div class="row">'
  +   '<select id="prefecture">' + opts + '</select>'
  +   '<input type="text" id="city" placeholder="市区町村">'
  + '</div>'
  + '<p class="err" id="e-area">都道府県と市区町村をご記入ください。</p>'
  + '</div>';
}
 
function fieldPhoneGeneral() {
  return '<div class="card">'
  + '<p class="q">お電話番号<span class="req">必須</span></p>'
  + '<p class="hint">この番号におかけします。ハイフンはあってもなくても構いません。</p>'
  + '<input type="tel" id="phone" inputmode="tel" placeholder="09012345678">'
  + '<p class="err" id="e-phone">ご記入ください。</p>'
  + '</div>';
}
 
function fieldPhoneSafety() {
  return '<div class="card">'
  + '<p class="q">お電話番号<span class="req">必須</span></p>'
  + '<p class="hint">'
  +   '<b>この番号に、こちらからおかけすることはありません。</b><br>'
  +   'お預かりするのは、万が一、事故や事件に直結するおそれがあると判断した場合に、'
  +   '安全の確認とご本人の確認をするためだけです。<br>'
  +   'ご用件のご連絡、お知らせ、ご様子うかがいなど、それ以外の目的で'
  +   'こちらからお電話することは一切ありません。'
  + '</p>'
  + '<input type="tel" id="phone" inputmode="tel" placeholder="09012345678">'
  + '<p class="err" id="e-phone">ご記入ください。</p>'
  + '</div>';
}
 
function fieldBands() {
  var h = '<div class="card">'
  + '<p class="q">お電話しやすい時間帯<span class="req">必須</span></p>'
  + '<p class="hint">あてはまるものをいくつでもお選びください。多いほど、おつなぎしやすくなります。</p>'
  + '<label class="opt"><input type="checkbox" name="band" value="いつでも可" onchange="onAnytime(this)"><span>いつでも可</span></label>';
  for (var i = 0; i < TIME_BANDS.length; i++) {
    h += '<label class="opt"><input type="checkbox" name="band" value="' + TIME_BANDS[i] + '"><span>' + TIME_BANDS[i] + '</span></label>';
  }
  h += '<label class="opt"><input type="checkbox" name="band" value="平日のみ"><span>平日のみ</span></label>'
    +  '<label class="opt"><input type="checkbox" name="band" value="土日祝のみ"><span>土日祝のみ</span></label>'
    +  '<p class="err" id="e-band">1つ以上お選びください。</p></div>';
  return h;
}
 
/* 「いつでも可」を選んだら他の時間帯は外す。矛盾した指定を残さないため。 */
function onAnytime(el) {
  if (!el.checked) return;
  var xs = document.getElementsByName('band');
  for (var i = 0; i < xs.length; i++) {
    if (xs[i] !== el && TIME_BANDS.indexOf(xs[i].value) >= 0) xs[i].checked = false;
  }
}
 
function fieldAppointment(title, hint) {
  var o = '<option value="">時間帯</option>';
  for (var i = 0; i < CLOCK.length; i++) {
    o += '<option value="' + CLOCK[i].v + '">' + CLOCK[i].label + '</option>';
  }
  return '<div class="card">'
  + '<p class="q">' + title + '<span class="req">必須</span></p>'
  + '<p class="hint">' + hint + '</p>'
  + '<div class="row"><input type="date" id="apptDate" min="' + today() + '"><select id="apptTime">' + o + '</select></div>'
  + '<p class="err" id="e-appt">日付と時刻をお選びください。</p>'
  + '</div>';
}
 
/* 過ぎた日付を選べないようにする。指定ミスで待ち時間が無駄になるのを防ぐため。 */
function today() {
  var d = new Date();
  d.setMinutes(d.getMinutes() + 9 * 60 - d.getTimezoneOffset()); // 日本時間で判定
  return d.toISOString().slice(0, 10);
}
 
function fieldSituation() {
  return '<div class="card">'
  + '<p class="q">いまのご状況<span class="req">必須</span></p>'
  + '<p class="hint">どなたとの間で、どのようなことが起きているか。書ける範囲で構いません。'
  + 'お電話の前に把握しておくことで、同じことを何度もお聞きせずに済みます。</p>'
  + '<textarea id="situation" placeholder=""></textarea>'
  + '<p class="err" id="e-situation">ご記入ください。</p>'
  + '</div>';
}
 
/*
   安全の確認は1問だけにした。
   「画面を見られるか」「知られたくないか」は、フォームを開く前の振り分けで
   すでに聞いている。同じことを二度聞くと、答えた側の信用を損なう。
 
   残したこの1問は、それらとは別の話をしている。
   一般ルートの折り返しは最長10日後。いま命に関わることが起きている人が
   10日待たされるのが、この仕組みで最も起きてはいけない失敗になる。
   ここに「はい」が入った時点で、Slackへ緊急として飛ばす。
*/
function fieldUrgent() {
  return '<div class="card">'
  + '<p class="q">いますぐ身の安全に関わる危険がありますか<span class="req">必須</span></p>'
  + '<p class="hint">対応方法を判断・検討するためにお聞きします。</p>'
  + '<label class="opt"><input type="radio" name="q3" value="いいえ" onchange="toggleUrgent()"><span>いいえ</span></label>'
  + '<label class="opt"><input type="radio" name="q3" value="はい" onchange="toggleUrgent()"><span>はい</span></label>'
  + '<p class="err" id="e-safety">お選びください。</p>'
  + '<div id="urgentBox" class="hidden" style="margin-top:14px">'
  +   '<p class="q" style="font-weight:500;font-size:14.5px;margin:0 0 4px">具体的なご状況をお知らせください</p>'
  +   '<p class="hint">箇条書き、短文でも構いません。</p>'
  +   '<textarea id="urgentDetail" placeholder=""></textarea>'
  +   '<p class="hint" style="margin-top:10px">'
  +     'いのちに関わる危険がいまある場合は、このフォームより先に'
  +     '<b>119番（救急）・110番（警察）</b>へお電話ください。'
  +   '</p>'
  + '</div>'
  + '</div>';
}
 
/* 「はい」を選んだときだけ記入欄を出す。答える必要のない人には見せない。 */
function toggleUrgent() {
  var box = document.getElementById('urgentBox');
  if (box) box.className = (radio('q3') === 'はい') ? '' : 'hidden';
}
 
function fieldNote() {
  return '<div class="card">'
  + '<p class="q">特記事項・備考</p>'
  + '<p class="hint">お伝えしておきたいことがあればお書きください。空欄のままでも送れます。<br>'
  + '例）耳が聞こえにくいので、ゆっくり話してほしい／小さい子どもがいて長く話せない／'
  + '平日昼間は仕事で出られない／すでに他の窓口に相談している</p>'
  + '<textarea id="note" placeholder=""></textarea>'
  + '</div>';
}
 
function fieldConsent() {
  return '<div class="card">'
  + '<p class="q">確認<span class="req">必須</span></p>'
  + '<p class="hint">ご記入いただいた内容は、担当者がご相談にあたるためだけに使います。'
  + 'ご本人の同意なく他の機関へお伝えすることはありません。'
  + 'ただし、いのちに関わる危険があると判断した場合には、'
  + '警察・消防・自治体などへ連絡することがあります。</p>'
  + '<label class="opt"><input type="checkbox" id="consent"><span>上記を読み、担当者からの連絡を希望します</span></label>'
  + '<p class="err" id="e-consent">チェックをお願いします。</p>'
  + '</div>';
}
 
/* ============================================================
   入力の取り出し・検証
   ============================================================ */
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function radio(name) {
  var xs = document.getElementsByName(name);
  for (var i = 0; i < xs.length; i++) if (xs[i].checked) return xs[i].value;
  return '';
}
function checks(name) {
  var xs = document.getElementsByName(name), a = [];
  for (var i = 0; i < xs.length; i++) if (xs[i].checked) a.push(xs[i].value);
  return a;
}
function err(id, on) {
  var e = document.getElementById(id);
  if (e) e.className = on ? 'err on' : 'err';
  return on;
}
 
function collect(kind) {
  var f = { route: kind };
  var bad = false;
 
  if (kind === 'note') {
    f.noteText = val('note');
    bad = err('e-note', !f.noteText) || bad;
    return bad ? null : f;
  }
 
  if (kind === 'close') {
    f.closeAnswer = radio('close');
    f.noteText = val('note');
    bad = err('e-close', !f.closeAnswer) || bad;
    return bad ? null : f;
  }
 
  if (kind === 'rebook') {
    f.appointmentDate = val('apptDate');
    f.appointmentTime = val('apptTime');
    f.situation = val('situation');
    bad = err('e-appt', !(f.appointmentDate && f.appointmentTime)) || bad;
    return bad ? null : f;
  }
 
  /* general / safety の共通部分 */
  f.name       = val('name');
  f.prefecture = val('prefecture');
  f.city       = val('city');
  f.phoneNumber= val('phone');
  f.safetyQ3   = radio('q3');
  f.urgentDetail = val('urgentDetail');
  f.note       = val('note');
  var consent  = document.getElementById('consent');
  f.consent    = (consent && consent.checked) ? '同意あり' : '';
 
  bad = err('e-name', !f.name) || bad;
  bad = err('e-area', !(f.prefecture && f.city)) || bad;
  bad = err('e-phone', !f.phoneNumber) || bad;
  bad = err('e-safety', !f.safetyQ3) || bad;
  bad = err('e-consent', !f.consent) || bad;
 
  if (kind === 'general') {
    f.contactMethod = 'こちらから電話';
    f.timeSlots = checks('band').join('、');
    bad = err('e-band', !f.timeSlots) || bad;
  } else {
    f.contactMethod = 'LINE通話（ご本人から）';
    f.appointmentDate = val('apptDate');
    f.appointmentTime = val('apptTime');
    f.situation = val('situation');
    bad = err('e-appt', !(f.appointmentDate && f.appointmentTime)) || bad;
    bad = err('e-situation', !f.situation) || bad;
  }
 
  return bad ? null : f;
}
 
/* ============================================================
   送信
   ============================================================ */
/*
   中身は Worker へ直接送る（トークには出さない）。
   トークに送るのは合図の1行だけ。Dify側がこの文字列で経路を判断するので、
   「詳細確認フォーム回答」「追記フォーム回答」の語は変えないこと。
*/
var MARKER = {
  general: '詳細確認フォーム回答：受付しました',
  safety:  '詳細確認フォーム回答：受付しました',
  rebook:  '詳細確認フォーム回答：あらためてのご希望を受付しました',
  note:    '追記フォーム回答：受付しました',
  close:   '追記フォーム回答：受付しました'
};
 
function submitForm(kind) {
  var f = collect(kind);
  if (!f) {
    var e = document.getElementById('e-all');
    if (e) e.className = 'err on';
    return;
  }
  var btn = document.getElementById('submit');
  if (btn) { btn.disabled = true; btn.textContent = '送信しています…'; }
 
  fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idToken: idToken, mode: kind, fields: f })
  }).then(function (r) {
    if (!r.ok) throw new Error('status ' + r.status);
    return liff.sendMessages([{ type: 'text', text: MARKER[kind] || MARKER.general }]).catch(function(){});
  }).then(function () {
    show(viewDone(kind));
    setTimeout(function () { try { liff.closeWindow(); } catch (e) {} }, 6000);
  }).catch(function (e) {
    console.log(e);
    if (btn) { btn.disabled = false; btn.textContent = 'もう一度送る'; }
    var el = document.getElementById('e-all');
    if (el) { el.textContent = '送信できませんでした。通信の状態をご確認のうえ、もう一度お試しください。'; el.className = 'err on'; }
  });
}
 
/* 送信後の画面。ここでトークの消し方をお伝えする。 */
function viewDone(kind) {
  var head = (kind === 'note' || kind === 'close')
    ? '承りました' : 'お預かりしました';
  var body = (kind === 'general')
    ? '担当者からなるべく早くお電話いたします。遅くとも1週間から10日以内にはご連絡します。お出になれなかった場合も、あらためておかけ直しします。'
    : (kind === 'safety' || kind === 'rebook')
    ? 'ご指定の1時間のあいだ、担当者がお待ちしております。LINEのトーク画面から通話ボタンを押してください。'
      + 'ご都合が悪くなった場合は、あらためて日時を決め直していただけますので、ご無理はなさらないでください。'
    : '担当者が確認いたします。';
 
  return '<div class="done">'
  + '<h2>' + head + '</h2>'
  + '<p>' + body + '</p>'
  + '<p>ご記入いただいた内容は、<b>このトーク画面には表示されません。</b>担当者にだけ届いています。</p>'
  + '<div class="tip">'
  +   'やり取りを残したくないときは、トーク一覧で長押しして削除できます。<br>'
  +   '削除しても、ご相談の記録はこちらに残っていますので、続きから話せます。'
  + '</div>'
  + '</div>';
}
 
boot();
</script>
</body>
</html>
