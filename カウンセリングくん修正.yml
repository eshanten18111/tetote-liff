        - description: この発言の緊急度を「高」「中」「低」の3段階でのみ判定してください。生命の危険に関わる複数の観点から評価すること：(1)自殺・自傷・具体的な計画や手段への言及、(2)DV・暴力被害・虐待(今すぐ危険な状況にいる可能性)、(3)所持金がない・住まいがない等の生存に関わる経済的危機、(4)その他生命・安全に関わる緊急事態。上記いずれかで具体的・切迫した内容があれば「高」。強い絶望感はあるが切迫度が不明、または上記に当てはまるが程度が軽い場合は「中」。それ以外(世間話や無関係な発言含む)は「低」。判断に迷う場合は安全側に倒し「中」以上を選ぶこと。
