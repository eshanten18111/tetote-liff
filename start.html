<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご相談の受付</title>
<!--
  入口の受付。

  はじめての方は、これまでどおり入力フォーム（index.html）へそのまま進む。
  一度お話ししたことのある方には、同じことを何度も書いていただかずに済むよう、
  ここで「おかえりなさい」とだけお伝えして、すぐ続きから話せるようにする。

  index.html には手を入れていない。
  入口フォームの形は変えない、という取り決めのため。
-->
<style>
  :root {
    --bg: #faf8f5;
    --fg: #2f2a24;
    --muted: #6b6156;
    --line: #e3ddd4;
    --accent: #3f6f5b;
    --accent-fg: #ffffff;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.85;
    font-size: 16px;
    padding: 24px 20px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
  }
  h1 { font-size: 19px; margin: 0 0 12px; font-weight: 600; letter-spacing: .02em; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.8; }
  .meta {
    border-top: 1px solid var(--line);
    margin-top: 16px; padding-top: 14px;
    color: var(--muted); font-size: 14px;
  }
  .meta div { margin-bottom: 4px; }
  button {
    display: block; width: 100%;
    font-family: inherit; font-size: 16px; font-weight: 600;
    padding: 15px 16px; margin-top: 12px;
    border-radius: 12px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-fg);
    cursor: pointer;
  }
  button.sub { background: transparent; color: var(--accent); font-weight: 500; }
  button:disabled { opacity: .5; }
  .loading { text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="loading">読み込んでいます…</div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  'use strict';

  var LIFF_ID = '2010836980-6NJLsZQ9';
  var PREFILL_ENDPOINT = 'https://tetote-line-dify.eshanten18111.workers.dev/prefill';
  var FORM_URL = 'index.html';

  var root = document.getElementById('root');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function goForm() { location.replace(FORM_URL); }

  // 迷ったら入力フォームへ。
  // 通信に失敗したときに何もできなくなるのが、いちばん困る。
  var settled = false;
  function fallback() { if (!settled) { settled = true; goForm(); } }
  var guard = setTimeout(fallback, 6000);

  function showWelcome(d) {
    settled = true;
    clearTimeout(guard);

    var name = String(d.name || '').trim();
    var greeting = name ? 'おかえりなさい、' + esc(name) + 'さん。' : 'おかえりなさい。';

    var meta = '';
    if (d.prefecture) meta += '<div>お住まい：' + esc(d.prefecture) + '</div>';
    if (d.mainIssue) meta += '<div>前回うかがったこと：' + esc(d.mainIssue) + '</div>';

    root.innerHTML =
      '<div class="card">' +
        '<h1>' + greeting + '</h1>' +
        '<p>前にうかがった内容はこちらで預かっています。<br>' +
        'はじめから書き直していただかなくて大丈夫です。</p>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
        '<button id="go">このまま相談を始める</button>' +
        '<button id="edit" class="sub">登録した内容を変える</button>' +
        '<p class="muted" style="margin-top:16px">' +
          'お名前や年代、お住まいなどが変わっていたら「登録した内容を変える」からどうぞ。' +
        '</p>' +
      '</div>';

    document.getElementById('go').addEventListener('click', function () {
      var b = this;
      b.disabled = true;
      b.textContent = '開いています…';
      liff.sendMessages([{ type: 'text', text: '相談を再開します' }])
        .then(function () { liff.closeWindow(); })
        .catch(function () { liff.closeWindow(); });
    });
    document.getElementById('edit').addEventListener('click', goForm);
  }

  function check(idToken) {
    if (!idToken) { fallback(); return; }
    fetch(PREFILL_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: idToken })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        // 名前も都道府県も無い＝実質はじめての方。素通りさせる。
        if (!d || !d.found || (!d.name && !d.prefecture)) { fallback(); return; }
        showWelcome(d);
      })
      .catch(fallback);
  }

  liff.init({ liffId: LIFF_ID })
    .then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      var t = null;
      try { t = liff.getIDToken(); } catch (e) { t = null; }
      check(t);
    })
    .catch(fallback);
})();
</script>
</body>
</html>
